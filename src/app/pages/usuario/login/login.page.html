<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <div class="toolbar-logo">
        <ion-icon name="heart-outline" class="logo-icon"></ion-icon>
        <span>Medistock</span>
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="hero-band">
    <div class="hero-icon-wrap">
      <ion-icon name="medical-outline"></ion-icon>
    </div>
    <h1 class="hero-title">Bienvenido</h1>
    <p class="hero-sub">Accede a tu cuenta y encuentra los insumos que necesitas, cuando los necesitas</p>
  </div>

  <svg class="hero-wave" viewBox="0 0 360 28" xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="none" width="100%" height="28">
    <path d="M0,0 C90,28 270,28 360,0 L360,28 L0,28 Z" fill="var(--ion-background-color, #f0f4f8)"/>
  </svg>

  <div class="form-area">
    <div class="field">
      <span class="field-label">Correo electrónico</span>
      <div class="field-wrap">
        <ion-icon name="mail-outline"></ion-icon>
        <ion-input type="email" placeholder="ejemplo@correo.com"
          [(ngModel)]="loginData.email" name="email">
        </ion-input>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Contraseña</span>
      <div class="field-wrap">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <ion-input type="password" placeholder="••••••••"
          [(ngModel)]="loginData.password" name="password">
        </ion-input>
      </div>
    </div>

    <ion-button expand="block" class="btn-login" (click)="onLogin()">
      <ion-icon name="arrow-forward-outline" slot="start"></ion-icon>
      Ingresar
    </ion-button>

    <div class="register-row">
      <span>¿No tienes cuenta?</span>
      <a routerLink="/registro">Regístrate aquí</a>
    </div>

    <p class="footer-note">Medistock · Sistema de gestión clínica v1.0</p>
  </div>
</ion-content>
