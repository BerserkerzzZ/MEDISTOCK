<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <div class="toolbar-logo">
        <ion-icon name="heart-outline" class="logo-icon"></ion-icon>
        <span>Medistock</span>
      </div>
    </ion-buttons>
    
    <ion-buttons slot="end">
      <ion-button *ngIf="estaLogueado" (click)="confirmarLogout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>

      <ion-button *ngIf="!estaLogueado" (click)="navegar('/login')">
        <ion-icon slot="icon-only" name="log-in-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="hero">
    <p class="hero-greeting">Bienvenido de vuelta</p>
    <h1 class="hero-name">{{ nombreUsuario }}</h1>
    <p class="hero-sub">¿Qué deseas gestionar hoy?</p>
  </div>

  <svg class="hero-wave" viewBox="0 0 360 28" xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="none" width="100%" height="28">
    <path d="M0,0 C90,28 270,28 360,0 L360,28 L0,28 Z" fill="var(--ion-background-color, #f0f4f8)"/>
  </svg>

  <div class="content-section">

    <p class="section-label">Accesos rápidos</p>

    <div class="menu-grid">
      <div class="menu-card" (click)="navegar('/catalogo')">
        <div class="menu-card-icon teal">
          <ion-icon name="medkit-outline"></ion-icon>
        </div>
        <span class="menu-card-label">Catálogo</span>
      </div>

      <div class="menu-card" (click)="navegar('/carrito')">
        <div class="menu-card-icon blue">
          <ion-icon name="cart-outline"></ion-icon>
        </div>
        <span class="menu-card-label">Carrito</span>
      </div>

      <div class="menu-card" (click)="navegar('/perfil')">
        <div class="menu-card-icon purple">
          <ion-icon name="person-circle-outline"></ion-icon>
        </div>
        <span class="menu-card-label">Mi perfil</span>
      </div>

      <div class="menu-card" (click)="navegar('/soporte')">
        <div class="menu-card-icon amber">
          <ion-icon name="help-buoy-outline"></ion-icon>
        </div>
        <span class="menu-card-label">Soporte</span>
      </div>
    </div>

  </div>

  <ion-alert
    [isOpen]="mostrarAlertLogout"
    header="Cerrar sesión"
    message="¿Estás seguro que deseas desconectarte?"
    [buttons]="alertButtons"
    (didDismiss)="mostrarAlertLogout = false">
  </ion-alert>

</ion-content>
